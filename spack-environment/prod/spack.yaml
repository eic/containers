spack:
  include:
  - ../concretizer.yaml
  - ../config.yaml
  - ../packages.yaml
  - path: ../packages_darwin.yaml
    when: platform == "darwin"
  - path: ../packages_linux.yaml
    when: platform == "linux"
  - ../packages_root_without_opengl.yaml
  - ../view.yaml
  specs:
  - acts
  - dd4hep
  - fastjet
  - fjcontrib
  - geant4 -opengl
  - hepmc3
  - irt
  - irt2
  - jana2
  - npsim -geocad
  - root
  - xrootd
