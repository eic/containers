# macOS-specific settings, complementing the cross-platform packages.yaml.
# Included from the environments via
#   - path: ../packages_darwin.yaml
#     when: platform == "darwin"
# See packages_linux.yaml for the Linux counterpart.
packages:
  binutils:
    require:
    - '@2.44:'
    # libiberty relies on implicit declarations and transitive includes
    # (LONG_MIN, dup2, ...) that newer Apple clang (21+) rejects
    - cflags="-include limits.h -include unistd.h -Wno-error=implicit-function-declaration"
  doxygen:
    require:
    - ~graphviz
  c:
    prefer:
    - apple-clang
    require:
    - apple-clang
  cxx:
    prefer:
    - apple-clang
    require:
    - apple-clang
  geant4:
    require:
    - any_of: [+opengl +qt, -opengl -qt]
    - ~x11
  gl:
    require:
    - apple-gl
  glu:
    require:
    - apple-glu
  root:
    require:
    - ~x
