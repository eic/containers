spack:
  include:
  - ../concretizer.yaml
  - ../config.yaml
  - path: ../packages_darwin.yaml
    when: platform == "darwin"
  - path: ../packages_linux.yaml
    when: platform == "linux"
  - ../packages_root_without_opengl.yaml
  - ../view.yaml
  - ../packages.yaml
  concretizer:
    duplicates:
      max_dupes:
        llvm: 2  # julia requires llvm with specific symbol suffixes
  specs:
  - acts
  - cmake
  - dd4hep
  - fastjet
  - fjcontrib
  - geant4 -opengl
  - hepmc3
  - intel-tbb
  - irt
  - jana2
  - julia
  - npsim -geocad
  - py-boto3
  - py-jinja2
  - py-jinja2-cli
  - py-pip
  - root
  - xrootd
