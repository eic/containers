spack:
  include:
  - ../concretizer.yaml
  - ../config.yaml
  - ../packages_root_without_opengl.yaml
  - path: ../packages_darwin.yaml
    when: platform == "darwin"
  - path: ../packages_linux.yaml
    when: platform == "linux"
  - ../view.yaml
  - ../packages.yaml
  definitions:
  # Note that in definitions 'when' takes a python expression as argument
  # https://spack.readthedocs.io/en/latest/environments.html#spec-list-references
  - when: arch.satisfies("platform=linux")
    linux_packages:
    - gfal2
    - gfal2-util
    - graphviz
    - imagemagick
    - nopayloadclient
    - ollama
    - py-numpy
    - py-onnxruntime
    - py-scipy
  - when: arch.satisfies("platform=darwin")
    linux_packages: []
  specs:
  - $linux_packages
  - acts
  - actsvg
  - afterburner
  - cmake
  - covfie
  - dd4hep
  - edm4hep
  - eiccontent
  - eigen
  - fastjet
  - fjcontrib
  - fmt
  - geant4 -opengl
  - hepmc3
  - hepmcmerger
  - heppdt
  - irt
  - irt2
  - iwyu
  - jana2
  - just
  - npsim -geocad
  - onnx
  - osg-ca-certs
  - pandorasdk
  - pelican
  - podio
  - prmon
  - pythia8
  - py-awkward
  - py-bokeh
  - py-boost-histogram
  - py-dask
  - py-dask-histogram
  - py-deepdiff
  - py-eic-rucio-policy-package
  - py-epic-capybara
  - py-graphviz
  - py-hepunits
  - py-hist
  - py-histoprint
  - py-jinja2
  - py-jinja2-cli
  - py-lmfit
  - py-lxml
  - py-matplotlib
  - py-mplhep
  - py-htgettoken
  - py-onnx
  - py-pandas
  - py-particle
  - py-pip
  - py-rucio-clients
  - py-seaborn
  - py-snakemake-storage-plugin-fs
  - py-snakemake-storage-plugin-pelican
  - py-snakemake-storage-plugin-rucio
  - py-toml
  - py-uproot
  - py-vector
  - root
  - snakemake
  - spdlog
  - timeframebuilder
  - xrootd
