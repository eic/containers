spack:
  include:
  - ../spack.lock
  - ../../concretizer.yaml
  - ../../config.yaml
  - path: ../../packages_darwin.yaml
    when: platform == "darwin"
  - path: ../../packages_linux.yaml
    when: platform == "linux"
  - ../../view.yaml
  - ../../packages.yaml
  packages:
    geant4:
      require:
      - ~opengl
  specs:
  - algorithms
  - edm4eic
  - eicrecon
  - epic@main # EPIC_VERSION
