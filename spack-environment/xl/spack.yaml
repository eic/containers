spack:
  include:
  - ../concretizer.yaml
  - ../config.yaml
  - ../packages.yaml
  - ../packages_root_with_opengl.yaml
  - ../view.yaml
  definitions:
  # Note that in definitions 'when' takes a python expression as argument
  # https://spack.readthedocs.io/en/latest/environments.html#spec-list-references
  - when: arch.satisfies("platform=linux")
    linux_packages:
    - dawncut
    - gdb
    - gfal2
    - gfal2-util
    - graphviz
    - herwig3
    - imagemagick
    - lcov
    - madx
    - mosquitto
    - nopayloadclient
    - ollama
    - py-onnxruntime
    - slurm sysconfdir=/etc/slurm
    - strace
    - valgrind
  - when: arch.satisfies("platform=darwin")
    linux_packages: []
  specs:
  - $linux_packages
  - acts
  - actsvg
  - afterburner
  - arrow
  - autoconf
  - automake
  - cairo
  - catch2
  - celeritas
