spack:
  include:
  - ../spack.lock
  - ../../concretizer.yaml
  - ../../config.yaml
  - ../../packages.yaml
  - ../../view.yaml
  concretizer:
    unify: when_possible
    duplicates:
      max_dupes:
        epic: 10
  packages:
    compiler-wrapper:
      require:
      - '@1.1.0-build-id'
    root:
      require:
      - build_type=RelWithDebInfo
    geant4:
      require:
      - +opengl
      - build_type=RelWithDebInfo
    acts:
      require:
      - build_type=RelWithDebInfo
    celeritas:
      require:
      - build_type=RelWithDebInfo
    dd4hep:
      require:
      - build_type=RelWithDebInfo
    edm4hep:
      require:
      - build_type=RelWithDebInfo
    hepmc3:
      require:
      - build_type=RelWithDebInfo
    podio:
      require:
      - build_type=RelWithDebInfo
  specs:
  - algorithms
  - edm4eic
  - eicrecon
  - epic@main # EPIC_VERSION
  - epic@26.05.0
  - epic@26.06.0
  - epic@26.07.0
  - epic@26.07.1
  - epic@26.07.2
  - epic@26.08.0
  repos:
    builtin_local: /uufs/chpc.utah.edu/common/home/u6059911/GIT/spack-packages/repos/spack_repo/builtin_local
