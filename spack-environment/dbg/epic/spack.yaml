spack:
  include:
  - ../spack.lock
  - ../../concretizer.yaml
  - ../../config.yaml
  - ../../packages.yaml
  - path: ../../packages_darwin.yaml
    when: platform == "darwin"
  - path: ../../packages_linux.yaml
    when: platform == "linux"
  - ../../view.yaml
  specs:
  - algorithms build_type=Debug
  - edm4eic build_type=Debug
  - eicrecon build_type=Debug
  - epic build_type=Debug # EPIC_VERSION
