name: Update eic-spack pin

on:
  schedule:
    - cron: '23 3 * * *' # nightly
  workflow_dispatch:

permissions:
  contents: write # push the update branch
  pull-requests: write # create/update the pull request

concurrency:
  group: update-eic-spack
  cancel-in-progress: false

jobs:
  update:
    name: Update eic-spack commit hash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          # Pull requests opened with the default GITHUB_TOKEN do not trigger
          # other workflows. Set the EIC_SPACK_UPDATE_TOKEN secret (a PAT or
          # GitHub App token) for the PR to get CI runs.
          token: ${{ secrets.EIC_SPACK_UPDATE_TOKEN || github.token }}

      - name: Create or update pull request
        env:
          GH_TOKEN: ${{ secrets.EIC_SPACK_UPDATE_TOKEN || github.token }}
        run: scripts/update-eic-spack-hash.sh
