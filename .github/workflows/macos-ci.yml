name: macOS CI Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  GITHUB_REGISTRY_USER: ${{ secrets.GHCR_REGISTRY_USER }}
  GITHUB_REGISTRY_TOKEN: ${{ secrets.GHCR_REGISTRY_TOKEN }}
  CVMFS_REPO: unpacked.cern.ch
  CVMFS_PATH_PREFIX: ghcr.io/eic
  PUBLISH_IMAGE_REPO: ghcr.io/${{ github.repository_owner }}
  SPACK_INSTALL_FLAGS: "--no-check-signature --show-log-on-error"

jobs:
  build:
    name: Build (${{ matrix.ENV }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        ENV: [ci, xl, tf]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract Spack configuration
        id: spack-config
        run: |
          # Source spack.sh to get SPACK_VERSION and SPACK_CHERRYPICKS
          source spack.sh
          echo "spack-version=${SPACK_VERSION}" >> $GITHUB_OUTPUT
          echo "spack-cherrypicks<<EOF" >> $GITHUB_OUTPUT
          echo "${SPACK_CHERRYPICKS}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Source spack-packages.sh to get SPACKPACKAGES_VERSION and SPACKPACKAGES_CHERRYPICKS
          source spack-packages.sh
          echo "spackpackages-version=${SPACKPACKAGES_VERSION}" >> $GITHUB_OUTPUT
          echo "spackpackages-cherrypicks<<EOF" >> $GITHUB_OUTPUT
          echo "${SPACKPACKAGES_CHERRYPICKS}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Source key4hep-spack.sh to get KEY4HEPSPACK_VERSION
          source key4hep-spack.sh
          echo "key4hepspack-version=${KEY4HEPSPACK_VERSION}" >> $GITHUB_OUTPUT

          # Source eic-spack.sh to get EICSPACK_VERSION
          source eic-spack.sh
          echo "eicspack-version=${EICSPACK_VERSION}" >> $GITHUB_OUTPUT

          # Extract buildcache URL from mirrors.yaml.in (simplified - get the version)
          echo "buildcache-version=${SPACKPACKAGES_VERSION}" >> $GITHUB_OUTPUT

      - name: Cache Spack checkouts
        id: cache-spack
        uses: actions/cache@v4
        with:
          path: spack
          key: spack-repos-${{ runner.os }}-${{ hashFiles('spack.sh', 'spack-packages.sh', 'key4hep-spack.sh', 'eic-spack.sh') }}

      - name: Checkout Spack repository
        if: steps.cache-spack.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: spack/spack
          path: spack
          ref: ${{ steps.spack-config.outputs.spack-version }}
          fetch-depth: 0

      - name: Configure spack
        if: steps.cache-spack.outputs.cache-hit != 'true'
        run: |
          cd ${{ github.workspace }}/spack
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # Fetch branches from which we cherry-pick
          git fetch origin refs/heads/develop:refs/heads/develop
          git fetch origin pull/51584/head:pr-51584
          git fetch origin pull/52207/head:pr-52207

          # Apply cherry-picks from spack.sh (match only valid git commit hashes)
          while read -r commit; do
            # Commits on branches/forks not fetched above are served by SHA
            if ! git cat-file -e "${commit}^{commit}" 2>/dev/null; then
              echo "Fetching ${commit} by SHA"
              git fetch origin "${commit}"
            fi
            if git merge-base --is-ancestor "${commit}" HEAD; then
              echo "Skipping already applied ${commit}"
              continue
            fi
            echo "Cherry-picking ${commit}"
            git cherry-pick "${commit}"
          done < <(echo "${{ steps.spack-config.outputs.spack-cherrypicks }}" | grep -E '^[a-f0-9]{40}$' || true)

          # Fallback to source build when binary relocation fails (e.g. unpadded binaries in buildcache)
          python3 -c '
          import pathlib
          path = pathlib.Path("lib/spack/spack/new_installer.py")
          content = path.read_text()
          old = (
              "    send_state(\"relocating\", state_stream)\n"
              "    spack.binary_distribution.extract_tarball(spec, tarball_stage, force=False)"
          )
          new = (
              "    send_state(\"relocating\", state_stream)\n"
              "    try:\n"
              "        spack.binary_distribution.extract_tarball(spec, tarball_stage, force=False)\n"
              "    except Exception as e:\n"
              "        shutil.rmtree(spec.prefix, ignore_errors=True)\n"
              "        spack.llnl.util.tty.warn(f\"Failed to install {spec.name} from binary cache ({e}); falling back to source build\")\n"
              "        return False"
          )
          if old in content:
              path.write_text(content.replace(old, new, 1))
              print("Patched new_installer.py to fall back to source build on binary relocation failure")
          '

      - name: Checkout spack-packages repository
        if: steps.cache-spack.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: spack/spack-packages
          path: spack/var/spack/repos/spack-packages
          fetch-depth: 0
          ref: ${{ steps.spack-config.outputs.spackpackages-version }}

      - name: Configure spack-packages
        if: steps.cache-spack.outputs.cache-hit != 'true'
        run: |
          cd ${{ github.workspace }}/spack/var/spack/repos/spack-packages
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # Fetch branches from which we cherry-pick
          git fetch origin refs/heads/develop:refs/heads/develop
          git fetch origin pull/3698/head:pr-3698
          git fetch origin pull/4871/head:pr-4871
          git fetch origin pull/5856/head:pr-5856

          # Apply cherry-picks from spack-packages.sh (match only valid git commit hashes)
          while read -r commit; do
            # Commits on forks/unmerged PRs are not in the default clone, but
            # GitHub serves any commit in the fork network by SHA from the parent
            if ! git cat-file -e "${commit}^{commit}" 2>/dev/null; then
              echo "Fetching ${commit} by SHA"
              git fetch origin "${commit}"
            fi
            if git merge-base --is-ancestor "${commit}" HEAD; then
              echo "Skipping already applied ${commit}"
              continue
            fi
            echo "Cherry-picking ${commit}"
            git cherry-pick "${commit}"
          done < <(echo "${{ steps.spack-config.outputs.spackpackages-cherrypicks }}" | grep -E '^[a-f0-9]{40}$' || true)

          cd ${{ github.workspace }}/spack
          spack repo add --scope site var/spack/repos/spack-packages/repos/spack_repo/builtin

      - name: Checkout key4hep-spack repository
        if: steps.cache-spack.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: key4hep/key4hep-spack
          path: spack/var/spack/repos/key4hep-spack
          ref: ${{ steps.spack-config.outputs.key4hepspack-version }}

      - name: Configure key4hep-spack
        if: steps.cache-spack.outputs.cache-hit != 'true'
        run: |
          cd ${{ github.workspace }}/spack
          spack repo add --scope site var/spack/repos/key4hep-spack

      - name: Checkout eic-spack repository
        if: steps.cache-spack.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: eic/eic-spack
          path: spack/var/spack/repos/eic-spack
          ref: ${{ steps.spack-config.outputs.eicspack-version }}

      - name: Configure eic-spack
        if: steps.cache-spack.outputs.cache-hit != 'true'
        run: |
          cd ${{ github.workspace }}/spack
          spack repo add --scope site var/spack/repos/eic-spack/spack_repo/eic

      - name: Add Spack to PATH
        run: echo "${{ github.workspace }}/spack/bin" >> $GITHUB_PATH

      - name: Cache Spack concretizer
        uses: actions/cache@v4
        with:
          path: ~/.spack/cache/concretization
          key: spack-concretizer-${{ runner.os }}-${{ matrix.ENV }}-${{ hashFiles('spack.sh', 'spack-packages.sh', 'key4hep-spack.sh', 'eic-spack.sh', 'spack-environment/**') }}
          restore-keys: |
            spack-concretizer-${{ runner.os }}-${{ matrix.ENV }}-
            spack-concretizer-${{ runner.os }}-

      - name: Setup build directory
        run: |
          sudo mkdir -p /opt/software /opt/local /opt/detector
          sudo chown -R "$(id -u):$(id -g)" /opt

      - name: Configure Spack build tree
        run: |
          set -x
          spack compiler find --scope site
          spack external find --scope site llvm
          spack config --scope site add "config:install_tree:root:'/opt/software'"
          spack config --scope site add "config:install_tree:padded_length:128"

      - name: Configure buildcache
        env:
          PUSH_BUILDCACHE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          mirror=oci://ghcr.io/eic/spack-${{ steps.spack-config.outputs.buildcache-version }}
          if [ "${PUSH_BUILDCACHE}" = "true" ] && [ -n "${GITHUB_REGISTRY_TOKEN}" ]; then
            spack mirror add --scope site eic \
              --autopush --unsigned \
              --oci-username-variable GITHUB_REGISTRY_USER \
              --oci-password-variable GITHUB_REGISTRY_TOKEN \
              "${mirror}"
          else
            echo "Buildcache is read-only for this run"
            spack mirror add --scope site eic --unsigned "${mirror}"
          fi
          spack mirror list

      - name: Concretize base environment
        run: |
          spack -e spack-environment/${{matrix.ENV}} -c view:false concretize --force

      - name: Build base environment
        run: |
          spack -e spack-environment/${{matrix.ENV}} -c view:false install ${{ env.SPACK_INSTALL_FLAGS }}

      - name: Concretize epic environment
        run: |
          spack -e spack-environment/${{matrix.ENV}}/epic -c view:false concretize --force

      - name: Build epic environment
        run: |
          spack -e spack-environment/${{matrix.ENV}}/epic -c view:false install ${{ env.SPACK_INSTALL_FLAGS }}

      - name: Upload Spack lockfiles
        uses: actions/upload-artifact@v4
        with:
          name: spack-locks-${{ matrix.ENV }}
          path: |
            spack-environment/${{ matrix.ENV }}/spack.lock
            spack-environment/${{ matrix.ENV }}/epic/spack.lock
          if-no-files-found: error

      - name: Diagnose numpy import
        if: failure()
        continue-on-error: true
        run: |
          for env in spack-environment/${{matrix.ENV}} spack-environment/${{matrix.ENV}}/epic; do
            echo "::group::${env}"
            spack -e "${env}" -c view:false find -lpv py-numpy openblas || true
            echo "--- loaded environment"
            (
              eval "$(spack -e "${env}" -c view:false load --sh py-numpy)"
              cd /tmp
              python3 -c 'import numpy; print(numpy.__version__, numpy.__file__)' 2>&1 | tail -30
              so=$(find "$(spack -e "${env}" -c view:false location -i py-numpy)" -name '_multiarray_umath*.so' | head -1)
              otool -L "${so}"
            ) || true
            echo "--- build environment of a failing dependent"
            for pkg in py-scipy py-numexpr; do
              spack -e "${env}" -c view:false build-env "${pkg}" -- \
                python3 -c 'import sys, numpy; print(numpy.__file__)' 2>&1 | tail -40 || true
            done
            echo "::endgroup::"
          done

  install:
    name: Install & Publish (${{ matrix.ENV }})
    needs: [build]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        ENV: [ci, xl, tf]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract Spack configuration
        id: spack-config
        run: |
          # Source spack.sh to get SPACK_VERSION and SPACK_CHERRYPICKS
          source spack.sh
          echo "spack-version=${SPACK_VERSION}" >> $GITHUB_OUTPUT
          echo "spack-cherrypicks<<EOF" >> $GITHUB_OUTPUT
          echo "${SPACK_CHERRYPICKS}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Source spack-packages.sh to get SPACKPACKAGES_VERSION and SPACKPACKAGES_CHERRYPICKS
          source spack-packages.sh
          echo "spackpackages-version=${SPACKPACKAGES_VERSION}" >> $GITHUB_OUTPUT
          echo "spackpackages-cherrypicks<<EOF" >> $GITHUB_OUTPUT
          echo "${SPACKPACKAGES_CHERRYPICKS}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Source key4hep-spack.sh to get KEY4HEPSPACK_VERSION
          source key4hep-spack.sh
          echo "key4hepspack-version=${KEY4HEPSPACK_VERSION}" >> $GITHUB_OUTPUT

          # Source eic-spack.sh to get EICSPACK_VERSION
          source eic-spack.sh
          echo "eicspack-version=${EICSPACK_VERSION}" >> $GITHUB_OUTPUT

          # Extract buildcache URL from mirrors.yaml.in (simplified - get the version)
          echo "buildcache-version=${SPACKPACKAGES_VERSION}" >> $GITHUB_OUTPUT

      - name: Cache Spack checkouts
        id: cache-spack
        uses: actions/cache@v4
        with:
          path: spack
          key: spack-repos-${{ runner.os }}-${{ hashFiles('spack.sh', 'spack-packages.sh', 'key4hep-spack.sh', 'eic-spack.sh') }}

      - name: Checkout Spack repository
        if: steps.cache-spack.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: spack/spack
          path: spack
          ref: ${{ steps.spack-config.outputs.spack-version }}
          fetch-depth: 0

      - name: Configure spack
        if: steps.cache-spack.outputs.cache-hit != 'true'
        run: |
          cd ${{ github.workspace }}/spack
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # Fetch branches from which we cherry-pick
          git fetch origin refs/heads/develop:refs/heads/develop
          git fetch origin pull/51584/head:pr-51584
          git fetch origin pull/52207/head:pr-52207

          # Apply cherry-picks from spack.sh (match only valid git commit hashes)
          while read -r commit; do
            # Commits on branches/forks not fetched above are served by SHA
            if ! git cat-file -e "${commit}^{commit}" 2>/dev/null; then
              echo "Fetching ${commit} by SHA"
              git fetch origin "${commit}"
            fi
            if git merge-base --is-ancestor "${commit}" HEAD; then
              echo "Skipping already applied ${commit}"
              continue
            fi
            echo "Cherry-picking ${commit}"
            git cherry-pick "${commit}"
          done < <(echo "${{ steps.spack-config.outputs.spack-cherrypicks }}" | grep -E '^[a-f0-9]{40}$' || true)

      - name: Checkout spack-packages repository
        if: steps.cache-spack.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: spack/spack-packages
          path: spack/var/spack/repos/spack-packages
          fetch-depth: 0
          ref: ${{ steps.spack-config.outputs.spackpackages-version }}

      - name: Configure spack-packages
        if: steps.cache-spack.outputs.cache-hit != 'true'
        run: |
          cd ${{ github.workspace }}/spack/var/spack/repos/spack-packages
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # Fetch branches from which we cherry-pick
          git fetch origin refs/heads/develop:refs/heads/develop
          git fetch origin pull/3698/head:pr-3698
          git fetch origin pull/4871/head:pr-4871
          git fetch origin pull/5856/head:pr-5856

          # Apply cherry-picks from spack-packages.sh (match only valid git commit hashes)
          while read -r commit; do
            # Commits on forks/unmerged PRs are not in the default clone, but
            # GitHub serves any commit in the fork network by SHA from the parent
            if ! git cat-file -e "${commit}^{commit}" 2>/dev/null; then
              echo "Fetching ${commit} by SHA"
              git fetch origin "${commit}"
            fi
            if git merge-base --is-ancestor "${commit}" HEAD; then
              echo "Skipping already applied ${commit}"
              continue
            fi
            echo "Cherry-picking ${commit}"
            git cherry-pick "${commit}"
          done < <(echo "${{ steps.spack-config.outputs.spackpackages-cherrypicks }}" | grep -E '^[a-f0-9]{40}$' || true)

          cd ${{ github.workspace }}/spack
          spack repo add --scope site var/spack/repos/spack-packages/repos/spack_repo/builtin

      - name: Checkout key4hep-spack repository
        if: steps.cache-spack.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: key4hep/key4hep-spack
          path: spack/var/spack/repos/key4hep-spack
          ref: ${{ steps.spack-config.outputs.key4hepspack-version }}

      - name: Configure key4hep-spack
        if: steps.cache-spack.outputs.cache-hit != 'true'
        run: |
          cd ${{ github.workspace }}/spack
          spack repo add --scope site var/spack/repos/key4hep-spack

      - name: Checkout eic-spack repository
        if: steps.cache-spack.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: eic/eic-spack
          path: spack/var/spack/repos/eic-spack
          ref: ${{ steps.spack-config.outputs.eicspack-version }}

      - name: Configure eic-spack
        if: steps.cache-spack.outputs.cache-hit != 'true'
        run: |
          cd ${{ github.workspace }}/spack
          spack repo add --scope site var/spack/repos/eic-spack/spack_repo/eic

      - name: Add Spack to PATH
        run: echo "${{ github.workspace }}/spack/bin" >> $GITHUB_PATH

      - name: Setup CVMFS mount point and install directories
        id: cvmfs-dirs
        run: |
          # Set up synthetic firmlink for /cvmfs on macOS
          sudo mkdir -p /System/Volumes/Data/cvmfs
          sudo chown -R "$(id -u):$(id -g)" /System/Volumes/Data/cvmfs
          if ! grep -q '^cvmfs[[:space:]]' /etc/synthetic.conf 2>/dev/null; then
            printf 'cvmfs\tSystem/Volumes/Data/cvmfs\n' | sudo tee -a /etc/synthetic.conf
          fi
          sudo /System/Library/Filesystems/apfs.fs/Contents/Resources/apfs.util -t || true

          # The environments' views (view.yaml) default to /opt/local and
          # /opt/detector, which Spack touches during environment initialization
          # before custom views are applied. Spack also renames the view directory,
          # so /opt itself must be writable.
          sudo mkdir -p /opt/local /opt/detector
          sudo chown "$(id -u):$(id -g)" /opt /opt/local /opt/detector

          # Target image name, tag, and install prefix
          IMAGE_NAME="mac_${{ matrix.ENV }}"
          PRIMARY_TAG="nightly"

          INSTALL_PREFIX="/cvmfs/${{ env.CVMFS_REPO }}/${{ env.CVMFS_PATH_PREFIX }}/${IMAGE_NAME}:${PRIMARY_TAG}"
          echo "install-prefix=${INSTALL_PREFIX}" >> $GITHUB_OUTPUT
          echo "image-name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "primary-tag=${PRIMARY_TAG}" >> $GITHUB_OUTPUT

          mkdir -p "${INSTALL_PREFIX}/opt/software" \
                   "${INSTALL_PREFIX}/opt/local" \
                   "${INSTALL_PREFIX}/opt/detector" \
                   "${INSTALL_PREFIX}/opt/spack-environment"

      - name: Download Spack lockfiles
        uses: actions/download-artifact@v4
        with:
          name: spack-locks-${{ matrix.ENV }}
          path: spack-environment/${{ matrix.ENV }}

      - name: Verify Spack lockfiles
        run: |
          ls -la "spack-environment/${{ matrix.ENV }}/spack.lock"
          ls -la "spack-environment/${{ matrix.ENV }}/epic/spack.lock"

      - name: Configure Spack target install tree
        run: |
          set -x
          spack compiler find --scope site
          spack external find --scope site llvm
          INSTALL_PREFIX="${{ steps.cvmfs-dirs.outputs.install-prefix }}"
          spack config --scope site add "config:install_tree:root:'${INSTALL_PREFIX}/opt/software'"
          spack -e spack-environment/${{ matrix.ENV }} -c view:false config add "view:{}"
          spack -e spack-environment/${{ matrix.ENV }} -c view:false config add "view:default:root:'${INSTALL_PREFIX}/opt/local'"
          spack -e spack-environment/${{ matrix.ENV }} -c view:false config add "view:detectors:root:'${INSTALL_PREFIX}/opt/detector'"
          spack -e spack-environment/${{ matrix.ENV }}/epic -c view:false config add "view:{}"
          spack -e spack-environment/${{ matrix.ENV }}/epic -c view:false config add "view:default:root:'${INSTALL_PREFIX}/opt/local'"
          spack -e spack-environment/${{ matrix.ENV }}/epic -c view:false config add "view:detectors:root:'${INSTALL_PREFIX}/opt/detector'"
          spack config get config

      - name: Configure buildcache
        run: |
          mirror=oci://ghcr.io/eic/spack-${{ steps.spack-config.outputs.buildcache-version }}
          if [ -n "${GITHUB_REGISTRY_TOKEN}" ]; then
            spack mirror add --scope site eic \
              --unsigned \
              --oci-username-variable GITHUB_REGISTRY_USER \
              --oci-password-variable GITHUB_REGISTRY_TOKEN \
              "${mirror}"
          else
            echo "Buildcache is read-only for this run"
            spack mirror add --scope site eic --unsigned "${mirror}"
          fi
          spack mirror list

      - name: Install base environment into target prefix
        run: |
          spack -e spack-environment/${{matrix.ENV}} -c view:false install ${{ env.SPACK_INSTALL_FLAGS }} --use-buildcache only

      - name: Install epic environment into target prefix
        run: |
          spack -e spack-environment/${{matrix.ENV}}/epic -c view:false install ${{ env.SPACK_INSTALL_FLAGS }} --use-buildcache only

      - name: Garbage collect build-only dependencies
        run: |
          spack gc --yes-to-all \
            -e spack-environment/${{ matrix.ENV }} \
            -e spack-environment/${{ matrix.ENV }}/epic
          spack clean --stage --downloads

      - name: Regenerate views
        run: |
          spack -e spack-environment/${{matrix.ENV}} env view regenerate || true
          spack -e spack-environment/${{matrix.ENV}}/epic env view regenerate

      - name: Setup environment and metadata
        run: |
          INSTALL_PREFIX="${{ steps.cvmfs-dirs.outputs.install-prefix }}"

          # Generate portable setup.sh for macOS users from Spack environment
          spack env activate --sh --dir spack-environment/${{matrix.ENV}}/epic > "${INSTALL_PREFIX}/setup.sh"
          chmod +x "${INSTALL_PREFIX}/setup.sh"

          # Detector symlinks fixup
          if [ -d "${INSTALL_PREFIX}/opt/detector" ]; then
            (
              shopt -s nullglob
              cd "${INSTALL_PREFIX}/opt/detector"
              for detector in epic-git.*_* ; do
                ln -sf "${detector}" "epic-${detector/*_/}"
              done
              if [ ! -e epic-main ] && [ -d epic-main_* ]; then
                ln -sf epic-main_* epic-main
              fi
            )
          fi

          # Copy spack environment definition
          cp -r spack-environment "${INSTALL_PREFIX}/opt/spack-environment"

          # Place CVMFS catalog markers
          touch "${INSTALL_PREFIX}/opt/software/.cvmfscatalog"
          find "${INSTALL_PREFIX}/opt/software" -mindepth 1 -maxdepth 2 -type d -exec touch {}/.cvmfscatalog \;
          touch "${INSTALL_PREFIX}/opt/local/.cvmfscatalog"
          find "${INSTALL_PREFIX}/opt/local" -mindepth 1 -maxdepth 1 -type d -exec touch {}/.cvmfscatalog \;
          touch "${INSTALL_PREFIX}/opt/detector/.cvmfscatalog"
          find "${INSTALL_PREFIX}/opt/detector" -mindepth 1 -maxdepth 1 -type d -exec touch {}/.cvmfscatalog \;
          touch "${INSTALL_PREFIX}/opt/spack-environment/.cvmfscatalog"

      - name: Smoke test installed environment
        run: |
          INSTALL_PREFIX="${{ steps.cvmfs-dirs.outputs.install-prefix }}"
          echo "Testing environment activation from ${INSTALL_PREFIX}/setup.sh..."
          source "${INSTALL_PREFIX}/setup.sh"
          which python3
          python3 --version
          python3 -c "import sys; print('Python sys.path:', sys.path)"
          if command -v root.exe >/dev/null 2>&1; then
            root.exe -b -q -e 'std::cout << "ROOT " << gROOT->GetVersion() << " functional\n"; gSystem->Exit(0);'
          fi

      - name: Setup crane
        uses: imjasonh/setup-crane@v0.7

      - name: Package and publish container
        env:
          PUSH_CONTAINER: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "${PUSH_CONTAINER}" != "true" ]; then
            echo "Skipping container publishing (push disabled or running in unprivileged fork context)."
            exit 0
          fi

          INSTALL_PREFIX="${{ steps.cvmfs-dirs.outputs.install-prefix }}"
          IMAGE_NAME="${{ steps.cvmfs-dirs.outputs.image-name }}"
          PRIMARY_TAG="${{ steps.cvmfs-dirs.outputs.primary-tag }}"
          PUBLISH_IMAGE="${{ env.PUBLISH_IMAGE_REPO }}/${IMAGE_NAME}:${PRIMARY_TAG}"

          TAGS=("${PRIMARY_TAG}")
          if [ "${{ github.ref_name }}" = "master" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            TAGS+=("master" "latest")
          fi

          # Optional authentication if custom credentials provided (setup-crane already authenticates to ghcr.io by default)
          if [ -n "${GITHUB_REGISTRY_TOKEN}" ]; then
            REGISTRY_USER="${GITHUB_REGISTRY_USER:-${{ github.actor }}}"
            echo "${GITHUB_REGISTRY_TOKEN}" | crane auth login ghcr.io -u "${REGISTRY_USER}" --password-stdin
          fi

          LAYER_TAR="/tmp/layer.tar.gz"
          echo "Archiving clean install tree directly from ${INSTALL_PREFIX}..."
          tar -czf "${LAYER_TAR}" -C "${INSTALL_PREFIX}" .
          echo "Layer archive size: $(du -h "${LAYER_TAR}" | cut -f1)"

          echo "Appending layer onto alpine:latest base and pushing ${PUBLISH_IMAGE}..."
          crane append \
            --platform=linux/arm64 \
            -b alpine:latest \
            -f "${LAYER_TAR}" \
            -t "${PUBLISH_IMAGE}"

          for tag in "${TAGS[@]:1}"; do
            echo "Tagging ${{ env.PUBLISH_IMAGE_REPO }}/${IMAGE_NAME}:${tag}..."
            crane tag "${PUBLISH_IMAGE}" "${tag}"
          done
          rm -f "${LAYER_TAR}"
          echo "Container published successfully!"

      - name: Diagnose numpy import
        if: failure()
        continue-on-error: true
        run: |
          for env in spack-environment/${{matrix.ENV}} spack-environment/${{matrix.ENV}}/epic; do
            echo "::group::${env}"
            spack -e "${env}" -c view:false find -lpv py-numpy openblas || true
            echo "--- loaded environment"
            (
              eval "$(spack -e "${env}" -c view:false load --sh py-numpy)"
              cd /tmp
              python3 -c 'import numpy; print(numpy.__version__, numpy.__file__)' 2>&1 | tail -30
              so=$(find "$(spack -e "${env}" -c view:false location -i py-numpy)" -name '_multiarray_umath*.so' | head -1)
              otool -L "${so}"
            ) || true
            echo "--- build environment of a failing dependent"
            for pkg in py-scipy py-numexpr; do
              spack -e "${env}" -c view:false build-env "${pkg}" -- \
                python3 -c 'import sys, numpy; print(numpy.__file__)' 2>&1 | tail -40 || true
            done
            echo "::endgroup::"
          done
